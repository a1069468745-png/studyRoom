spring:
  application:
    name: auth-service
  datasource:
    url: ${STUDYROMM_AUTH_DB_URL:jdbc:mariadb://localhost:3306/auth_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${STUDYROMM_AUTH_DB_USERNAME:studyromm_app}
    password: ${STUDYROMM_AUTH_DB_PASSWORD:change-me}
  flyway:
    enabled: true
    default-schema: auth_service
    schemas:
      - auth_service
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
studyromm:
  security:
    token-secret: ${STUDYROMM_TOKEN_SECRET:dev-only-token-secret-change-me}
    token-ttl: 8h
    service-tokens:
      knowledge-service: ${STUDYROMM_SERVICE_TOKEN_KNOWLEDGE:knowledge-service-dev-token}
